openapi: 3.0.4
info:
  title: CrushSuite Service API
  version: "1.0.0"
  description: >
    OpenAPI for the Service API namespace mounted at `/service-api`. Includes
    compliance checks, fee calculation, and event logging.
    Based on OpenAPI 3.0.4 spec.
    Reference: https://github.com/OAI/OpenAPI-Specification/blob/main/versions/3.0.4.md


    Prefer not to call these endpoints directly? Use the
    [@crushsuite/sdk](https://www.npmjs.com/package/@crushsuite/sdk) package
    for a typed JavaScript/TypeScript client.
externalDocs:
  description: "@crushsuite/sdk on npm"
  url: https://www.npmjs.com/package/@crushsuite/sdk
servers:
  - url: https://crush-suite-production.up.railway.app/service-api
    description: Production
  - url: https://crush-suite-staging.up.railway.app/service-api
    description: Staging

tags:
  - name: Health
  - name: Compliance
  - name: Events

paths:
  /:
    get:
      tags: [Health]
      summary: Service API root
      security: []
      description: Simple health endpoint for the Service API namespace.
      responses:
        "200":
          description: Root reached successfully
          content:
            text/plain:
              schema:
                type: string
                example: success, you have hit the root of the service-api

  /compliance/prepurchase-compliance:
    post:
      tags: [Compliance]
      summary: Verify purchase compliance
      description: >
        Checks whether a proposed order is compliant and returns result,
        possible compliance fee, and optionally a `complianceKey` when valid.
      security:
        - ApiKeyAuth: []
        - ApiKeySandboxAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCheckComplianceRequest"
      responses:
        "200":
          description: Compliance check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderCheckComplianceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /compliance/alcohol-fee:
    post:
      tags: [Compliance]
      summary: Get compliance fee products
      description: >
        Calculates alcohol compliance fees for valid orders without performing
        a full compliance validation.
      security:
        - ApiKeyAuth: []
        - ApiKeySandboxAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCheckComplianceFeeRequest"
      responses:
        "200":
          description: Fee calculation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderCheckComplianceFeeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /compliance/compliance-event:
    post:
      tags: [Events]
      summary: Record precompliance event
      description: >
        Records a precompliance event for analytics/troubleshooting purposes.
        Intended to be best-effort; returns success message even when logging fails.
      security:
        - ApiKeyAuth: []
        - ApiKeySandboxAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrecomplianceEvent"
      responses:
        "200":
          description: Event recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required: [message]
                example:
                  message: event recorded
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Private API key for production/standard access.
    ApiKeySandboxAuth:
      type: apiKey
      in: header
      name: x-api-key-sandbox
      description: Sandbox API key. When present, applies sandbox context.

  responses:
    BadRequest:
      description: >
        Invalid request payload. Returned when the body is empty or fails
        validation. The body is a plain-text error message.
      content:
        text/plain:
          schema:
            type: string
            example: no body in request
    Unauthorized:
      description: Missing or invalid API key. The body is a plain-text error message.
      content:
        text/plain:
          schema:
            type: string
            example: Not Authorized
    TooManyRequests:
      description: >
        Rate limit exceeded. Limits are per API key over a 60-second window
        (typically 60 requests per minute).
      headers:
        Retry-After:
          description: Seconds until the current rate-limit window resets.
          schema:
            type: integer
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
            required: [message]
            example:
              message: Too Many Requests
    InternalError:
      description: Internal server error. The body is a plain-text error message.
      content:
        text/plain:
          schema:
            type: string

  schemas:
    VariantQuantity:
      type: object
      properties:
        id:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1
      required: [id, quantity]

    OrderCheckComplianceAddress:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        businessName:
          type: string
        street1:
          type: string
        street2:
          type: string
        city:
          type: string
        postalCode:
          type: string
        stateCode:
          type: string
        country:
          type: string
          description: Two-letter country code
      required:
        - firstName
        - lastName
        - street1
        - city
        - postalCode
        - stateCode
        - country

    OrderCheckComplianceDOB:
      type: object
      properties:
        day:
          type: integer
          minimum: 1
          maximum: 31
        month:
          type: integer
          minimum: 1
          maximum: 12
        year:
          type: integer
          minimum: 1900
      required: [day, month, year]

    VariantQuantityWithPrice:
      allOf:
        - $ref: "#/components/schemas/VariantQuantity"
        - type: object
          properties:
            unitPrice:
              type: number
              description: >
                Optional unit price in major units (e.g. `19.99`). Only used by
                merchants whose compliance partner is ShipCompliant, where it
                overrides the stored product price (useful when a discount
                applies). Ignored for other compliance partners.
              example: 19.99

    OrderCheckComplianceRequest:
      type: object
      properties:
        variants:
          type: array
          items:
            $ref: "#/components/schemas/VariantQuantityWithPrice"
        billToAddress:
          $ref: "#/components/schemas/OrderCheckComplianceAddress"
        shipToAddress:
          $ref: "#/components/schemas/OrderCheckComplianceAddress"
        dob:
          $ref: "#/components/schemas/OrderCheckComplianceDOB"
        email:
          type: string
          format: email
        phoneNumber:
          type: string
        bypassKYC:
          type: boolean
          description: For development/testing purposes
        includesExternalComplianceProduct:
          type: boolean
          description: >
            Set to `true` when the order contains products that are not managed
            by CrushSuite but still need compliance checks (for example, wine
            club subscriptions from another app). When none of the variants are
            CrushSuite-managed products, only age verification (21+) and state
            licensing are checked. Without this flag, such an order passes
            without checks.
          default: false
      required:
        - variants
        - billToAddress
        - shipToAddress
        - dob
        - email
        - phoneNumber

    OrderCheckComplianceResponse:
      type: object
      properties:
        valid:
          type: boolean
        complianceFee:
          allOf:
            - $ref: "#/components/schemas/OrderCheckComplianceFeeResponse"
          description: >
            Compliance fee for the order, in the same shape as the
            `/compliance/alcohol-fee` response. `fee` is `null` when the order
            is invalid or no fee applies.
        complianceKey:
          type: string
          nullable: true
          description: Only set when `valid` is `true`.
        errors:
          type: array
          nullable: true
          description: >
            Reasons the order failed compliance. May be `null` or an empty
            array when the order is valid.
          items:
            type: string
      required: [valid, complianceFee, complianceKey, errors]
      example:
        valid: true
        complianceFee:
          fee:
            "12345": 2
          total: 3
        complianceKey: abc123-compliance-key
        errors: []

    OrderCheckComplianceFeeRequest:
      type: object
      properties:
        shippingStateCode:
          type: string
        variants:
          type: array
          items:
            $ref: "#/components/schemas/VariantQuantity"
      required: [shippingStateCode, variants]

    OrderCheckComplianceFeeResponse:
      type: object
      properties:
        fee:
          type: object
          additionalProperties:
            type: integer
          nullable: true
          example:
            "12345": 2
          description: >
            Map of compliance fee product variant ID to the quantity to add to
            the cart, or `null` when no fee applies.
        total:
          type: number
          description: Total compliance fee amount (fee quantity x fee product price). `0` when no fee applies.
      required: [fee, total]

    PrecomplianceEvent:
      type: object
      properties:
        sessionId:
          type: string
        eventType:
          type: string
          enum: [INITIATED, SUBMITTED, APPROVED, FAILED]
          description: Event type identifier
        failedReason:
          type: string
        failedPayload:
          type: string
          description: JSON string
        failedUser:
          type: string
          description: JSON string
      required: [sessionId, eventType]
